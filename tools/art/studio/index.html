<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요괴 하숙집 — Asset Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#1a1620; --panel:#2e2733; --border:#7a7180; --text:#ede6dc; --dim:#b3adb5; --accent:#f2a65a; --ok:#7fb2a6; --bad:#c9503f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font: 13px/1.4 system-ui, "Malgun Gothic", sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:15px; margin:0 12px 0 0; color:var(--accent); }
  header button.tab { background:transparent; color:var(--dim); border:1px solid transparent; padding:4px 10px; border-radius:3px; cursor:pointer; }
  header button.tab.active { color:var(--text); border-color:var(--border); background:var(--bg); }
  header .status { margin-left:auto; color:var(--dim); font-size:12px; max-width:50%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  main { display:grid; grid-template-columns: 340px 1fr; height: calc(100vh - 41px); }
  aside { border-right:1px solid var(--border); overflow:auto; padding:10px; background:#241e29; }
  section.view { overflow:auto; padding:10px; }
  .hidden { display:none !important; }
  h2 { font-size:13px; color:var(--accent); margin:12px 0 6px; }
  label { display:block; color:var(--dim); font-size:12px; margin-top:6px; }
  input, select, textarea, button { font: inherit; }
  input[type=text], input[type=number], select, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:4px 6px; }
  button.primary { background:var(--accent); color:#1a1620; border:none; border-radius:3px; padding:6px 10px; cursor:pointer; font-weight:600; }
  button.ghost { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:4px 8px; cursor:pointer; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
  .thumb { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:6px; cursor:pointer; text-align:center; }
  .thumb.selected { border-color:var(--accent); }
  .thumb img { image-rendering: pixelated; max-width:100%; height:64px; object-fit:contain; background:
    repeating-conic-gradient(#3a3340 0 25%, #2a2430 0 50%) 0 0/16px 16px; }
  .thumb .name { font-size:11px; word-break:break-all; margin-top:4px; }
  .thumb .meta { font-size:10px; color:var(--dim); }
  .badge { display:inline-block; font-size:10px; padding:1px 5px; border-radius:8px; margin:2px 1px 0; }
  .badge.ok { background:var(--ok); color:#1a1620; } .badge.bad { background:var(--bad); color:#fff; } .badge.dim { background:#4a4352; }
  canvas.stage { image-rendering: pixelated; background:#000; border:1px solid var(--border); display:block; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .slots { display:flex; flex-direction:column; gap:4px; }
  .slot { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:3px; padding:4px 6px; cursor:pointer; }
  .slot.selected { border-color:var(--accent); }
  .slot .key { flex:1; font-size:12px; }
  .slot .file { color:var(--dim); font-size:10px; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slot .ab { font-size:10px; color:var(--accent); }
  table.manifest { border-collapse:collapse; width:100%; font-size:12px; }
  table.manifest th, table.manifest td { border:1px solid var(--border); padding:2px 4px; text-align:left; }
  table.manifest input, table.manifest select { padding:2px 4px; font-size:12px; }
  pre.log { background:#000; color:#b3adb5; padding:8px; font-size:11px; max-height:220px; overflow:auto; white-space:pre-wrap; }
  .picker { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
  .picker .box { background:var(--panel); border:1px solid var(--border); border-radius:6px; width:min(900px, 90vw); max-height:85vh; overflow:auto; padding:12px; }
  .kbd { color:var(--accent); font-family: monospace; }
</style>
</head>
<body>
<header>
  <h1>요괴 하숙집 · Asset Studio</h1>
  <button class="tab active" data-tab="library">서재</button>
  <button class="tab" data-tab="sprite">스프라이트</button>
  <button class="tab" data-tab="composer">화면</button>
  <button class="tab" data-tab="manifest">매니페스트</button>
  <button class="ghost" id="btn-validate" title="tools/art/validate_assets.py">규격 검증</button>
  <button class="primary" id="btn-save" title="art_assets.csv 저장 + build_resources.py">저장 → 게임 반영</button>
  <span class="status" id="status">불러오는 중…</span>
</header>
<main>
  <aside id="side"></aside>
  <section class="view" id="view"></section>
</main>
<script src="app.js"></script>
</body>
</html>
